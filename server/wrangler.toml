name = "gestionale-server"
account_id = "dd5f7a5f9a0457863a93fc5cc9bc1cd2"
compatibility_date = "2024-03-01"
compatibility_flags = ["nodejs_compat"]

# ─── LOCAL DEV ────────────────────────────────────────────────────────────────
# Used by: npm run dev
# Database: local SQLite emulator (no network, reset-safe)
# Secrets: overridden by .dev.vars

[vars]
# CORS_ORIGIN = "http://localhost:5173"
DEPLOYMENT_MODE = "single_org" # top-level config is what production deploys; local dev overrides via .dev.vars
CORS_ORIGIN = "https://niki.lacrimosica.com"
GOOGLE_REDIRECT_BASE_URL = "https://gestionale-server.m-gdrzi77.workers.dev"
APP_URL = "https://niki.lacrimosica.com"
# JWT_SECRET               → comes from .dev.vars locally, never hardcoded here
# GOOGLE_SERVICE_ACCOUNT_KEY → wrangler secret put GOOGLE_SERVICE_ACCOUNT_KEY
# MFA_ENCRYPTION_KEY       → wrangler secret put MFA_ENCRYPTION_KEY (openssl rand -base64 32); without it
#                            authenticator-app sign-in is off and admins are not forced to enrol
# EMAIL_PROVIDER           → unset: email codes and email verification are off; "log" in .dev.vars for dev
# TEMPLATE_FOLDER_ID and OUTPUT_FOLDER_ID are now stored in DB settings (Settings → Documents)

[[d1_databases]]
binding = "DB"
database_name = "gestionale-ets-db"
database_id = "4df11d70-8eea-4f4f-bca4-63a26c8dfc59"
migrations_dir = "drizzle/migrations/dev"

# Throttles login, password and setup endpoints (src/lib/rate-limit.ts).
# namespace_id is any integer unique per environment so counters aren't shared.
# period must be 10 or 60 seconds.
[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[observability]
enabled = true

# ─── ENVIRONMENT-SPECIFIC CONFIGS ─────────────────────────────────────────────
# Staging and production configs are in separate files:
#   - wrangler.staging.toml
#   - wrangler.prod.toml
# These files are NOT committed to git (.gitignore)

# ─── PRODUCTION (ENVIRONMENT-SPECIFIC) ────────────────────────────────────
# This file contains environment-specific overrides for production.
# Should NOT be committed to git (add to .gitignore).

[env.production.vars]
CORS_ORIGIN = "https://niki.lacrimosica.com"
GOOGLE_REDIRECT_BASE_URL = "https://gestionale-server.m-gdrzi77.workers.dev"
APP_URL = "https://niki.lacrimosica.com"
DEPLOYMENT_MODE = "single_org"

[[env.production.d1_databases]]
binding = "DB"
database_name = "gestionale-ets-db"
database_id = "4df11d70-8eea-4f4f-bca4-63a26c8dfc59"
migrations_dir = "drizzle/migrations/prod"

# Throttles login, password and setup endpoints (src/lib/rate-limit.ts).
# namespace_id is any integer unique per environment so counters aren't shared.
# period must be 10 or 60 seconds.
[[env.production.ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# ─── STAGING (ENVIRONMENT-SPECIFIC) ───────────────────────────────────────
# This file contains environment-specific overrides for staging.
# Should NOT be committed to git (add to .gitignore).

[env.staging.vars]
CORS_ORIGIN = "https://niki-staging.lacrimosica.com"
GOOGLE_REDIRECT_BASE_URL = "https://gestionale-server-staging.m-gdrzi77.workers.dev"
APP_URL = "https://niki-staging.lacrimosica.com"
DEPLOYMENT_MODE = "closed" # public demo moving to a separate env; staging closed after real data was found here

[[env.staging.d1_databases]]
binding = "DB"
database_name = "gestionale-ets-db-staging"
database_id = "a0aba6f8-f4b9-4260-ae99-c95462590cfc"
migrations_dir = "drizzle/migrations/staging"

# Throttles login, password and setup endpoints (src/lib/rate-limit.ts).
# namespace_id is any integer unique per environment so counters aren't shared.
# period must be 10 or 60 seconds.
[[env.staging.ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

# ─── DEMO (PUBLIC) ────────────────────────────────────────────────────────
# Public sandbox linked from the README. Fake data only; wiped and reseeded
# nightly by the gestionale-demo-reset worker (wrangler.demo-reset.toml).
# Should NOT be committed to git (add to .gitignore).

[env.demo.vars]
CORS_ORIGIN = "https://niki-demo.lacrimosica.com"
GOOGLE_REDIRECT_BASE_URL = "https://gestionale-server-demo.m-gdrzi77.workers.dev"
APP_URL = "https://niki-demo.lacrimosica.com"
DEPLOYMENT_MODE = "open"
MFA_REQUIRED_ROLES = "" # shared demo login must not be forced into two-step enrolment

[[env.demo.d1_databases]]
binding = "DB"
database_name = "gestionale-ets-db-demo"
database_id = "c9a6ad93-3f55-473e-a6c7-362f77879d4f"
migrations_dir = "drizzle/migrations/dev"


# Throttles login, password and setup endpoints (src/lib/rate-limit.ts).
# namespace_id is any integer unique per environment so counters aren't shared.
# period must be 10 or 60 seconds.
[[env.demo.ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1004"
simple = { limit = 10, period = 60 }